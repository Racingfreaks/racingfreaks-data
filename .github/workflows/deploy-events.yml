name: Deploy events.json to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'events.json'
      - '.github/workflows/deploy-events.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p dist
          cp events.json dist/events.json
          # _headers: CORS so racingfreaks.de can fetch api.racingfreaks.de,
          # plus aggressive CDN caching (browser 5 min, edge 10 min).
          cat > dist/_headers << 'EOF'
          /events.json
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, OPTIONS
            Cache-Control: public, max-age=300, s-maxage=600
            Content-Type: application/json; charset=utf-8
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=racingfreaks-data --branch=main
